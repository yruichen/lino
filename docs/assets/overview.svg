 <text x="52" y="117" fill="#f1f5ff" font-size="48" font-weight="700">Inside the Markdown editor.</text>
 <text x="52" y="152" fill="#afbdd9" font-size="19">83 modules. Native bridges. Evidence you can follow.</text>
