[package]
name = "lino-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "generate-swift"
path = "../../tools/protocol/generate-swift.rs"
required-features = ["bindgen"]

[dependencies]
lino-runtime.workspace = true
lino-protocol.workspace = true
uniffi = "=0.32.2"
serde_json = "1.0.154"
serde = "1.0.229"
