[workspace]
members = [
    "crates/document",
    "crates/markdown",
    "crates/application",
    "crates/adapters",
    "crates/protocol",
    "crates/runtime",
    "crates/ffi",
]
resolver = "2"

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
lino-document = { path = "crates/document" }
lino-markdown = { path = "crates/markdown" }
lino-application = { path = "crates/application" }
lino-adapters = { path = "crates/adapters" }
lino-protocol = { path = "crates/protocol" }
lino-runtime = { path = "crates/runtime" }
lino-ffi = { path = "crates/ffi" }
