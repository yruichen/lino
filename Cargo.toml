[workspace]
members = [
    "crates/document",
    "crates/markdown",
    "crates/application",
    "crates/adapters",
    "crates/protocol",
    "crates/runtime",
    "crates/ffi",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
open-typora-document = { path = "crates/document" }
open-typora-markdown = { path = "crates/markdown" }
open-typora-application = { path = "crates/application" }
open-typora-adapters = { path = "crates/adapters" }
open-typora-protocol = { path = "crates/protocol" }
open-typora-runtime = { path = "crates/runtime" }
open-typora-ffi = { path = "crates/ffi" }
